server:
  http_listen_port: 9081
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://YOUR_SERVER_IP:3100/loki/api/v1/push

scrape_configs:
  - job_name: mikrotik
    static_configs:
      - targets: [localhost]
        labels:
          job: mikrotik
          __path__: /var/log/mikrotik/complex_mikrotik.json

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            identity: identity
            program: program
            level: level
            message: message
      - template:
          source: level
          template: '{{- $l := ToLower .level -}}{{- if or (eq $l "err") (eq $l "error") -}}error{{- else if or (eq $l "crit") (eq $l "critical") -}}critical{{- else -}}{{$l}}{{- end -}}'
      - labels:
          identity:
          program:
          level:

      - match:
          selector: '{job="mikrotik"}'
          stages:
            - regex:
                expression: '(?:changed|added) by [^:]+:(?P<actor>[^@[:space:]]+)@(?P<srcip>[0-9.]+) \((?P<cmd>[^)]+)'
            - labels:
                actor:
                srcip:

      - timestamp:
          source: timestamp
          format: RFC3339